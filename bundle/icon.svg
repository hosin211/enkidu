<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Enkidu's mark: two cuneiform wedges standing side by side, the second one in the app's own blue: the one who
       works beside you. On the window's dark. The tile is macOS's own: 824 px on a 1024 px canvas, with its soft
       shadow. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2032"/>
      <stop offset="1" stop-color="#0B0E16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#night)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="3" fill="#FFF" opacity="0.22" clip-path="url(#tile)"/>
  <g stroke-width="18" stroke-linejoin="round">
    <g fill="#F3EEE4" stroke="#F3EEE4">
      <path d="M318 262L374 418L387 762L421 762L434 418L490 262Z"/>
    </g>
    <g fill="#4F7DFF" stroke="#4F7DFF">
      <path d="M534 262L590 418L603 762L637 762L650 418L706 262Z"/>
    </g>
  </g>
</svg>
