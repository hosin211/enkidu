[package]
name = "enkidu-app"
description = "Enkidu: the GPUI app."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "enkidu-app"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
enkidu-term = { path = "../enkidu-term" }
enkidu-core = { path = "../enkidu-core" }
enkidu-ui = { path = "../enkidu-ui" }
enkidu-model = { path = "../enkidu-model" }
enkidu-diff = { path = "../enkidu-diff" }
enkidu-syntax = { path = "../enkidu-syntax" }
anyhow.workspace = true
futures.workspace = true
image.workspace = true
unicode-bidi.workspace = true
unicode-width.workspace = true
serde.workspace = true
serde_json.workspace = true
# Only to read where AppKit puts the window's own buttons (the frame measuring plan); the same versions GPUI uses.
objc2-app-kit = { version = "=0.3.2", features = ["NSView", "NSWindow", "NSButton", "NSControl", "NSResponder"] }
raw-window-handle = "=0.6.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# the load test tells a frame's own work (its thread's CPU time) from a wait for the machine
libc.workspace = true
enkidu-testkit = { path = "../enkidu-testkit" }
tempfile.workspace = true

# Pictures of the window, drawn offscreen by Metal with no window on screen. AppKit needs the main thread, so this
# target has its own main (`harness = false`); it runs only when named: `cargo test -p enkidu-app --test shots`.
[[test]]
name = "shots"
path = "tests/shots.rs"
harness = false
test = false
