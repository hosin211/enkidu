query($q: String!, $after: String) {
  viewer { login }
  search(query: $q, type: ISSUE, first: 25, after: $after) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes {
      ... on PullRequest {
        id number title url isDraft state updatedAt mergedAt
        headRefName baseRefName
        body createdAt additions deletions changedFiles
        author { login }
        labels(first: 20) { nodes { name } }
        reviewRequests(first: 20) { nodes { requestedReviewer { __typename
          ... on User { login } ... on Bot { login } ... on Mannequin { login } ... on Team { name } } } }
        mergeable
        reviewDecision
        headCommit: commits(last: 1) { nodes { commit { id oid committedDate
          statusCheckRollup { state contexts(first: 50) { totalCount pageInfo { hasNextPage endCursor }
            nodes { __typename
              ... on CheckRun { name conclusion status detailsUrl }
              ... on StatusContext { context state targetUrl } } } } } } }
        allCommits: commits(last: 100) { totalCount nodes { commit { oid messageHeadline } } }
        reviewThreads(first: 50) { totalCount pageInfo { hasNextPage endCursor }
          nodes { id isResolved isOutdated path line originalLine
            comments(first: 30) { totalCount pageInfo { hasNextPage endCursor }
              nodes { id author { login __typename } body createdAt url } } } }
        comments(last: 30) { totalCount nodes { id author { login __typename } body createdAt url } }
        reviews(last: 20) { totalCount nodes { id state author { login __typename } submittedAt } }
      }
    }
  }
}
